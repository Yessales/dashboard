body{background:#0e1520;font-family:'Segoe UI',sans-serif;color:#dde8ff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:8px 16px;background:#0c1528;border-bottom:1px solid #1a2e58;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
h1{font-size:13px;font-weight:700;color:#7ab3ff}
.tabs{display:flex;gap:4px}
.tab{padding:4px 13px;border-radius:5px;border:1px solid #1e3060;background:transparent;color:#7ab3ff;cursor:pointer;font-size:11px;transition:all .15s}
.tab.active{background:#1a3570;border-color:#4070d0;color:#fff}
#ibar{padding:3px 16px;background:#090e1c;font-size:10px;color:#4d6a99;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid #0f1828;flex-shrink:0}
#ibar b{color:#88b4ee}
#ibar .highlight{color:#ffcc44;font-weight:700}
#main{flex:1;display:flex;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block}
#sidebar{width:200px;background:#090e1c;border-left:1px solid #0f1828;padding:10px;overflow-y:auto;flex-shrink:0;font-size:10px}
#sidebar h3{color:#7ab3ff;font-size:11px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1a2e58}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.leg-color{width:24px;height:12px;border-radius:2px;flex-shrink:0}
.sidebar-stat{margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #0f1828}
.stat-label{color:#5577aa}
.stat-val{color:#88b4ee;font-weight:600}
.stat-val.gold{color:#ffcc44}
.stat-val.orange{color:#cc9933}
#tip{position:absolute;background:rgba(5,12,32,.97);border:1px solid #254888;border-radius:6px;padding:8px 12px;font-size:10.5px;pointer-events:none;display:none;z-index:50;line-height:1.7;min-width:180px}
#tip .tl{font-size:12px;font-weight:700;color:#aad4ff;margin-bottom:2px}
#tip .tv{color:#50e090;font-weight:700}
#tip .tn{color:#334466}
#controls{position:absolute;bottom:10px;left:10px;font-size:9px;color:#253548;line-height:1.8}
#zoom-btns{position:absolute;bottom:10px;right:10px;display:flex;gap:4px}
.zbtn{width:28px;height:28px;border-radius:5px;border:1px solid #1e3060;background:#0d1830;color:#7ab3ff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.zbtn:hover{background:#1a3060}

#search-bar{padding:7px 10px;border-bottom:1px solid #0f1828}
#sku-input{width:100%;background:#0d1a35;border:1px solid #1e3060;color:#a0c8ff;border-radius:4px;padding:5px 8px;font-size:10.5px;outline:none;box-sizing:border-box}
#sku-input:focus{border-color:#4070d0}
#sku-input::placeholder{color:#2a3a55}
#sku-results{max-height:120px;overflow-y:auto;margin-top:4px}
.sku-row{padding:3px 5px;border-radius:3px;cursor:pointer;border-bottom:1px solid #0a1020}
.sku-row:hover{background:#0d2040}
.sku-code{color:#7ab3ff;font-family:monospace;font-size:9px}
.sku-name{color:#5577aa;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sku-detail{margin-top:5px;padding:5px;background:#0a1020;border-radius:4px;display:none;font-size:9.5px;max-height:200px;overflow-y:auto}
.sd-title{color:#aad4ff;font-weight:700;margin-bottom:3px;font-size:10px}
.sd-loc-row{display:flex;justify-content:space-between;padding:2px 3px;border-bottom:1px solid #0f1828;cursor:pointer;border-radius:2px}
.sd-loc-row:hover{background:#0d2040}
.sd-lcode{color:#6a9acc;font-family:monospace;font-size:9px}
.sd-lqty{color:#50e090;font-weight:700}
.sd-bar{height:3px;border-radius:2px;margin:0 3px 2px}
.sd-def{color:#cc9933;font-size:9px;padding:3px;margin-top:2px;border-top:1px solid #1a2030}
#detail-list{font-size:9.5px;max-height:calc(100vh - 420px);overflow-y:auto}
.dl-row{display:flex;justify-content:space-between;align-items:center;padding:2px 3px;border-bottom:1px solid #0f1828;cursor:default;border-radius:2px}
.dl-row:hover{background:#0d1a30}
.dl-loc{color:#6a9acc;font-family:monospace;font-size:9px}
.dl-qty{color:#50e090;font-weight:700;font-size:9.5px}
.dl-qty.zero{color:#2a3a55}
.dl-bar{height:4px;border-radius:2px;margin-top:1px;transition:width .2s}
.dl-shelf{font-size:8px;color:#445566;padding:1px 3px;background:#0a1020;border-radius:2px;margin-left:4px}
.dl-bay-group{padding:2px 0;border-bottom:1px solid #0d1525}
.dl-bay-hdr{display:flex;justify-content:space-between;padding:1px 3px;color:#5588aa;font-size:9px;font-family:monospace}
.dl-summary{padding:4px 3px;color:#5577aa;font-size:9px;border-bottom:1px solid #1a2e58;margin-bottom:3px}
.view-toggle{display:flex;gap:3px;margin-bottom:5px}
.vtab{padding:2px 7px;border-radius:3px;border:1px solid #1e3060;background:transparent;color:#7ab3ff;cursor:pointer;font-size:9px}
.vtab.active{background:#1a3570;border-color:#4070d0;color:#fff}

#pw-overlay{position:fixed;inset:0;background:#12112a;display:flex;align-items:center;justify-content:center;z-index:9999}
#pw-box{background:#fff;border-radius:20px;padding:48px 40px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
#pw-box h2{font-size:18px;font-weight:800;color:#12112a;letter-spacing:1px;margin-bottom:4px}
#pw-box p{font-size:13px;color:#8892a4;margin-bottom:24px}
#pw-lock{font-size:48px;margin-bottom:20px}
#pw-input{width:100%;padding:14px 18px;border:1.5px solid #e0e4ef;border-radius:10px;font-size:15px;outline:none;color:#12112a;text-align:center;letter-spacing:4px}
#pw-input:focus{border-color:#4070d0}
#pw-btn{margin-top:14px;width:100%;padding:15px;background:#12112a;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:2px;cursor:pointer}
#pw-btn:hover{background:#1e2a4a}
#pw-err{color:#e05050;font-size:11px;margin-top:8px;height:14px}

#tpl-wrap{flex:1;overflow:hidden;padding:12px 16px;display:none;flex-direction:column}
#tpl-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-shrink:0}
#tpl-title{color:#7ab3ff;font-size:13px;font-weight:700}
#tpl-stats{font-size:10px;color:#5577aa}
#tpl-body{display:flex;gap:10px;flex:1;overflow:hidden;min-height:0}
#tpl-groups-col{width:180px;flex-shrink:0;overflow-y:auto}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.group-cell{border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .15s}
.group-cell:hover{filter:brightness(1.3)}
.group-selected{border-color:#50e090 !important;box-shadow:0 0 8px rgba(50,255,150,0.4)}
#tpl-pallet-panel{flex:1;overflow-y:auto;background:#070e1c;border-radius:6px;border:1px solid #1a2e58;padding:10px;display:none}
</style>
</head>

    <div id="pw-err"></div>
  </div>
</div>
<script>
function checkPW(){
  const v=document.getElementById('pw-input').value;
  if(v==='1103'){
    document.getElementById('pw-overlay').style.display='none';
    sessionStorage.setItem('wms_auth','1');
    setTimeout(()=>{resize();switchWH('PICO');},50);
  } else {
    document.getElementById('pw-err').textContent='Incorrect password';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
if(sessionStorage.getItem('wms_auth')==='1'){
  document.addEventListener('DOMContentLoaded',()=>{
    const o=document.getElementById('pw-overlay');
    if(o) o.style.display='none';
    setTimeout(()=>{if(typeof resize==='function'){resize();switchWH('PICO');}},100);
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('pw-input').focus();
});
